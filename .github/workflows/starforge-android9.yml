name: StarForge Android 9 Test

on:
  push:
    branches: ["starforge/governance-kernel"]
  pull_request:
    branches: ["starforge/governance-kernel"]

permissions:
  contents: write

concurrency:
  group: starforge-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run starforge:preflight
      - run: npm run starforge:test
      - run: npm run test:starforge:integration
      - run: npm run starforge:integration-test
      - run: node --test test/starforge.android9.test.mjs
      - run: npm run test:starforge:android9:shell
      - name: Record green StarForge state
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/starforge/governance-kernel'
        run: |
          node scripts/starforge-validation-checkpoint.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .starforge/validation-state.json

          if git diff --cached --quiet; then
            echo "StarForge validation state already current."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node scripts/starforge-validation-checkpoint.mjs
            git add .starforge/validation-state.json

            if git diff --cached --quiet; then
              echo "StarForge validation state already current."
              exit 0
            fi

            git commit -m "chore: checkpoint green StarForge state [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Green StarForge validation checkpoint published."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish green validation checkpoint after $attempt attempts."
              exit 1
            fi

            sleep $((attempt * 2))
          done
