name: StarForge Android 9 Test

on:
  push:
    branches: ["starforge/governance-kernel"]
  pull_request:
    branches: ["starforge/governance-kernel"]

permissions:
  contents: write

concurrency:
  group: starforge-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: C3 failure and security gate
        run: node --test test/starforge.c3-failure-security-gate.test.mjs
      - name: C4 financial reality gate
        run: node --test test/starforge.c4-financial-reality.test.mjs
      - name: C5 HQ and mobile reality gate
        run: node --test test/starforge.c5-hq-mobile-reality.test.mjs
      - name: D1 production APInex integration gate
        run: node --test test/starforge.d1-production-apinex-integration.test.mjs
      - name: D2 governed model execution gate
        run: node --test test/starforge.d2-governed-model-execution.test.mjs
      - name: D3 verified business outcome gate
        run: node --test test/starforge.d3-verified-business-outcome.test.mjs
      - name: D4 leadership report review gate
        run: node --test test/starforge.d4-leadership-report-review.test.mjs
      - name: D5 PA independent execution oversight gate
        run: node --test test/starforge.d5-pa-independent-execution-oversight.test.mjs
      - name: D6 financial governance approval gate
        run: node --test test/starforge.d6-financial-governance-approval.test.mjs
      - name: D7 CHO decision integrity gate
        run: node --test test/starforge.d7-cho-decision-integrity.test.mjs
      - name: D8 governance observability gate
        run: node --test test/starforge.d8-governance-observability.test.mjs
      - name: D9 persistence integrity gate
        run: node --test test/starforge.d9-persistence-integrity.test.mjs
      - name: D10 recovery integrity gate
        run: node --test test/starforge.d10-recovery-integrity.test.mjs
      - name: D11 recovery lifecycle integrity gate
        run: node --test test/starforge.d11-recovery-lifecycle-integrity.test.mjs
      - name: D12 governed recovery execution gate
        run: node --test test/starforge.d12-governed-recovery-execution.test.mjs
      - name: D13 recovery outcome integrity gate
        run: node --test test/starforge.d13-recovery-outcome-integrity.test.mjs
      - name: D14 recovery persistence authority gate
        run: node --test test/starforge.d14-recovery-persistence-authority.test.mjs
      - name: D15 governance audit integrity gate
        run: node --test test/starforge.d15-governance-audit-integrity.test.mjs
      - name: D16 governance command isolation gate
        run: node --test test/starforge.d16-governance-command-isolation.test.mjs
      - run: npm run starforge:preflight
      - run: npm run starforge:test
      - run: npm run test:starforge:integration
      - run: npm run starforge:integration-test
      - run: node --test test/starforge.android9.test.mjs
      - run: npm run test:starforge:android9:shell
      - run: npm run test:starforge:runtime
      - run: npm run test:starforge:runtime:connection
      - name: APInex live free-model discovery gate
        if: ${{ env.APINEX_API_KEY != '' }}
        run: npm run test:starforge:apinex:live
      - name: C2 real APInex business execution gate
        if: ${{ env.APINEX_API_KEY != '' }}
        run: node --test test/starforge.c2-apinex-business-live.test.mjs
      - name: Record green StarForge state
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/starforge/governance-kernel'
        run: |
          node scripts/starforge-validation-checkpoint.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .starforge/validation-state.json

          if git diff --cached --quiet; then
            echo "StarForge validation state already current."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            node scripts/starforge-validation-checkpoint.mjs
            git add .starforge/validation-state.json

            if git diff --cached --quiet; then
              echo "StarForge validation state already current."
              exit 0
            fi

            git commit -m "chore: checkpoint green StarForge state [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Green StarForge validation checkpoint published."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish green validation checkpoint after $attempt attempts."
              exit 1
            fi

            sleep $((attempt * 2))
          done
