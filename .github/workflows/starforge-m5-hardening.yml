name: StarForge M5 Production Hardening Gate

on:
  push:
    branches: ["starforge/governance-kernel"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starforge-m5-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5-production-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: StarForge preflight
        run: npm run starforge:preflight
      - name: Full StarForge regression
        run: npm run starforge:test
      - name: Android 9 shell compatibility
        run: npm run test:starforge:android9:shell
      - name: Android 9 packaging contract
        run: npm run test:starforge:android9:packaging
      - name: Runtime connection hardening
        run: npm run test:starforge:runtime:connection
      - name: Governed model delegation hardening
        run: npm run test:starforge:governed-model-delegation
      - name: Compute Economy integrity
        run: npm run test:starforge:compute-economy
      - name: Secret exposure scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: StarForge integration gate
        run: npm run starforge:integration-test
      - name: Mobile HQ contract
        env:
          STARFORGE_MOBILE_CI: "1"
        run: npm run starforge:mobile-test

  m5-input-isolation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run StarNet UI input-isolation proof
        shell: pwsh
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          $log = "${env:RUNNER_TEMP}\starnet-ui.log"
          $err = "${env:RUNNER_TEMP}\starnet-ui.err"
          $p = Start-Process -FilePath "node" -ArgumentList "scripts/serve-ui-only.js" -WorkingDirectory "${env:GITHUB_WORKSPACE}" -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          try {
            for ($i = 0; $i -lt 100; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8087/" -TimeoutSec 1
                if ($r.StatusCode -eq 200) { break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if ($i -ge 100) {
              Get-Content $log -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "StarNet UI did not become ready"
            }
            # Current Edge builds can be policy-gated from exposing the DevTools Protocol.
            # This runner is disposable CI, so explicitly allow remote debugging for the isolated
            # test browser. The browser still uses its own temporary --user-data-dir and loopback only.
            $edgePolicy = "HKCU:\\Software\\Policies\\Microsoft\\Edge"
            New-Item -Path $edgePolicy -Force | Out-Null
            New-ItemProperty -Path $edgePolicy -Name "RemoteDebuggingAllowed" -PropertyType DWord -Value 1 -Force | Out-Null
            Write-Host "RemoteDebuggingAllowed=$(Get-ItemPropertyValue -Path $edgePolicy -Name RemoteDebuggingAllowed)"
            $candidates = @(
              "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
              "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
            )
            $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $browser) { throw "No CI Chromium runtime found (Edge)" }
            "STARNET_CHROME=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using CI Chromium runtime: $browser"
            Write-Host "=== Direct Edge CDP launch probe ==="
            $probePort = 9229
            $probeProfile = Join-Path $env:RUNNER_TEMP "starnet-edge-cdp-probe"
            $probeLog = Join-Path $env:RUNNER_TEMP "starnet-edge-cdp-probe.log"
            $probeErr = Join-Path $env:RUNNER_TEMP "starnet-edge-cdp-probe.err"
            Remove-Item -LiteralPath $probeProfile -Recurse -Force -ErrorAction SilentlyContinue
            $edgeProbeArgs = @(
              "--headless=new",
              "--disable-gpu",
              "--no-first-run",
              "--no-default-browser-check",
              "--disable-extensions",
              "--remote-debugging-address=127.0.0.1",
              "--remote-debugging-port=$probePort",
              "--remote-allow-origins=*",
              "--user-data-dir=$probeProfile",
              "about:blank"
            )
            $edgeProbe = Start-Process -FilePath $browser -ArgumentList $edgeProbeArgs -RedirectStandardOutput $probeLog -RedirectStandardError $probeErr -PassThru
            try {
              $probeReady = $false
              for ($j = 0; $j -lt 80; $j++) {
                try {
                  $v = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$probePort/json/version" -TimeoutSec 1
                  if ($v.StatusCode -eq 200) { $probeReady = $true; break }
                } catch {}
                if ($edgeProbe.HasExited) { break }
                Start-Sleep -Milliseconds 250
              }
              if (-not $probeReady) {
                Write-Host "Edge CDP probe did not expose /json/version."
                Write-Host "=== Edge probe stdout ==="
                Get-Content $probeLog -ErrorAction SilentlyContinue
                Write-Host "=== Edge probe stderr ==="
                Get-Content $probeErr -ErrorAction SilentlyContinue
                throw "CI Edge could not expose a loopback CDP endpoint on port $probePort"
              }
              Write-Host "Edge CDP /json/version is reachable on 127.0.0.1:$probePort"
              Write-Host $v.Content
            } finally {
              if ($edgeProbe -and -not $edgeProbe.HasExited) { Stop-Process -Id $edgeProbe.Id -Force -ErrorAction SilentlyContinue }
              Remove-Item -LiteralPath $probeProfile -Recurse -Force -ErrorAction SilentlyContinue
            }
            Write-Host "Running local input-isolation proof with all environment proxies disabled."
            Write-Host "=== Direct HTTP loopback diagnostics ==="
            curl.exe --noproxy "*" -sS -D - http://127.0.0.1:8087/ -o "$env:RUNNER_TEMP\starnet-ui-body.html"
            if ($LASTEXITCODE -ne 0) { throw "curl.exe could not reach the IPv4 loopback UI server" }
            Write-Host "=== Listening socket ==="
            netstat -ano | findstr ":8087"
            Write-Host "=== CDP browser proof ==="
            node scripts/qa/input-isolation-smoke.mjs --url http://127.0.0.1:8087/?smoke --monitor-ms 5000 --cdp-port 9229
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
          }

      - name: Stop StarNet UI
        if: always()
        shell: pwsh
        run: |
          if ($env:STARFORGE_UI_PID) {
            Stop-Process -Id ([int]$env:STARFORGE_UI_PID) -Force -ErrorAction SilentlyContinue
          }

  m5-final-gate:
    needs: [m5-production-hardening, m5-input-isolation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: M5 production hardening gate
        run: |
          if [ "${{ needs.m5-production-hardening.result }}" != "success" ] || [ "${{ needs.m5-input-isolation.result }}" != "success" ]; then
            echo "M5 PRODUCTION HARDENING GATE: FAIL"
            echo "production=${{ needs.m5-production-hardening.result }}"
            echo "input-isolation=${{ needs.m5-input-isolation.result }}"
            exit 1
          fi
          echo "M5 PRODUCTION HARDENING GATE: PASS"
          echo "Core regression, Android 9 compatibility, runtime connection, governed delegation,"
          echo "Compute Economy, secret scanning, integration, mobile HQ, and input isolation all passed."
          echo "SAFE TO PROCEED WITH FINAL RELEASE-CANDIDATE VALIDATION."

  release-candidate-validation:
    needs: [m5-final-gate]
    if: ${{ needs.m5-final-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: RC StarForge preflight
        run: npm run starforge:preflight
      - name: RC full regression
        run: npm run starforge:test
      - name: RC HQ reality
        run: npm run test:starforge:integration
      - name: RC mobile shell and HQ contract
        run: |
          npm run test:starforge:android9:shell
          npm run starforge:mobile-test
      - name: RC Compute Economy
        run: npm run test:starforge:compute-economy
      - name: RC governed delegation
        run: npm run test:starforge:governed-model-delegation
      - name: RC runtime connection
        run: npm run test:starforge:runtime:connection
