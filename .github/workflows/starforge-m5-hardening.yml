name: StarForge M5 Production Hardening Gate

on:
  push:
    branches: ["starforge/governance-kernel"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starforge-m5-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m5-production-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: StarForge preflight
        run: npm run starforge:preflight
      - name: Full StarForge regression
        run: npm run starforge:test
      - name: Android 9 shell compatibility
        run: npm run test:starforge:android9:shell
      - name: Android 9 packaging contract
        run: npm run test:starforge:android9:packaging
      - name: Runtime connection hardening
        run: npm run test:starforge:runtime:connection
      - name: Governed model delegation hardening
        run: npm run test:starforge:governed-model-delegation
      - name: Compute Economy integrity
        run: npm run test:starforge:compute-economy
      - name: Secret exposure scan
        run: npm run security:secrets
      - name: StarForge integration gate
        run: npm run starforge:integration-test
      - name: Mobile HQ contract
        env:
          STARFORGE_MOBILE_CI: "1"
        run: npm run starforge:mobile-test
      - name: M5 production hardening gate
        run: |
          echo "M5 PRODUCTION HARDENING GATE"
          echo "Core regression, Android 9 compatibility, runtime connection, governed delegation,"
          echo "Compute Economy, secret scanning, integration, and mobile HQ all passed."
          echo "SAFE TO PROCEED WITH FINAL RELEASE-CANDIDATE VALIDATION."

  m5-input-isolation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start StarNet UI for input-isolation proof
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMPstarnet-ui.log"
          $err = "$env:RUNNER_TEMPstarnet-ui.err"
          $p = Start-Process -FilePath "node" -ArgumentList "scripts/serve-ui-only.js" -WorkingDirectory "$env:GITHUB_WORKSPACE" -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          "STARFORGE_UI_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          for ($i=0; $i -lt 100; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8787/" -TimeoutSec 1
              if ($r.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Milliseconds 200
          }
          if ($i -ge 100) {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            throw "StarNet UI did not become ready"
          }
      - name: Input isolation security proof
        run: node scripts/qa/input-isolation-smoke.mjs --url http://127.0.0.1:8787/?smoke --monitor-ms 5000
      - name: Stop StarNet UI
        if: always()
        shell: pwsh
        run: |
          if ($env:STARFORGE_UI_PID) {
            Stop-Process -Id ([int]$env:STARFORGE_UI_PID) -Force -ErrorAction SilentlyContinue
          }
