name: StarForge M8 Governance Reality

on:
  push:
    branches: ["starforge/governance-kernel"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starforge-m8-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefer-offline
      - name: M8.1 governance authority gate
        run: node --test test/starforge.m8.1-governance.test.mjs
      - name: StarForge operations regression
        run: npm run test:starforge:operations
      - name: StarForge integration reality
        run: npm run test:starforge:integration
